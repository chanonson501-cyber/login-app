<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ยินดีต้อนรับ</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: Arial, sans-serif;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            color: #ff6f61;
            font-size: 2.5rem;
            font-weight: bold;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            font-size: 1rem;
            color: #666;
            text-decoration: none;
        }
        /* โค้ดสำหรับทำให้ตัวอักษรขยับขึ้นลง */
   .moving-text {
     animation: bounce 1s infinite alternate;
   }

   @keyframes bounce {
     0% {
       transform: translateY(0);
     }
     100% {
       transform: translateY(-10px); /* ขยับขึ้นไป 10 พิกเซล */
     }
   }
    </style>
</head>
<body>

    <div class="box">
        <!-- เติม class="moving-text" ตรงนี้ -->
        <h1 class="moving-text">ยินดีต้อนรับเข้าสู่ระบบ</h1>
        <img src="{{ url_for('static', filename='ploy.png') }}" alt="รูปของฉัน" style="width: 200px; border-radius: 20%; margin-bottom: 20px;">
        CHANON LOVE THAPANEE <br>
        จุ๊บๆ <br>
        <a href="/">ออกจากระบบ (Logout)</a>
    </div>

</body>
</html>
