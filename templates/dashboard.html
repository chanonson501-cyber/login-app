<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ยินดีต้อนรับ</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: Arial, sans-serif;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            color: #ff6f61;
            font-size: 2.5rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;

        }
        a {
            display: inline-block;
            margin-top: 20px;
            font-size: 1rem;
            color: #666;
            text-decoration: none;
        }


   @keyframes bounce {
     0% {
       transform: translateY(0);
     }
     100% {
       transform: translateY(-10px); /* ขยับขึ้นไป 10 พิกเซล */
     }
   }
    </style>
</head>
<body>

    <div class="box">
      
        <img src="{{ url_for('static', filename='test.jpg') }}" alt="รูปของฉัน" style="width: 200px; border-radius: 20%; margin-bottom: 20px;">
        SYSTEST<br>
        <a href="/">ออกจากระบบ (Logout)</a>
      </div>

</body>
</html>
