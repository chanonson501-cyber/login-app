<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแรก - ระบบของฉัน</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #050b14;
            color: white;
        }
        /* แถบเมนูด้านบน */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #050b14;
            border-bottom: 1px solid #1a2634;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .nav-icons {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .icon-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 20px;
        }
        
        /* เนื้อหาหน้าเว็บจำลอง */
        .hero {
            padding: 80px 40px;
            max-width: 800px;
        }
        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .hero p {
            color: #a0aec0;
            font-size: 18px;
            line-height: 1.6;
        }

        /* หน้าต่าง Modal ล็อกอิน (ซ่อนไว้ก่อนจนกว่าจะกดปุ่ม) */
        .modal-overlay {
            display: none; /* ซ่อนเริ่มต้น */
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .login-box {
            background-color: #0b1329;
            padding: 40px;
            border-radius: 8px;
            width: 380px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            position: relative;
            border: 1px solid #1a2634;
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            background: none; border: none;
            color: #a0aec0; font-size: 24px;
            cursor: pointer;
        }
        .login-box h2 {
            margin-top: 0;
            margin-bottom: 10px;
        }
        .login-box p {
            color: #a0aec0;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #a0aec0;
            margin-bottom: 8px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background-color: #050b14;
            border: 1px solid #2a3b4c;
            border-radius: 4px;
            color: white;
            box-sizing: border-box;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #00cccc;
            color: #050b14;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .submit-btn:hover {
            background-color: #00b3b3;
        }
    </style>
</head>
<body>

    <!-- แถบเมนูด้านบน -->
    <header>
        <div class="logo">CHANON SONRIT</div>
        <div class="nav-icons">
            <button class="icon-btn">🔍</button>
            <button class="icon-btn">🛒</button>
            <!-- ปุ่มรูปคน: พอกดแล้วจะเรียกฟังก์ชันเปิดหน้าต่างล็อกอิน -->
            <button class="icon-btn" onclick="openLoginModal()">👤</button>
        </div>
    </header>

    <!-- เนื้อหาหน้าเว็บ -->
    <section class="hero">
        <h1>Transform workflow for everyone</h1>
        <p>ยินดีต้อนรับสู่ระบบควบคุมและจัดการพลังงานอัจฉริยะ ในวิชา PYTHON</p>
    </section>

    <!-- กล่องป๊อปอัปหน้าล็อกอิน (ซ่อนอยู่) -->
    <div class="modal-overlay" id="loginModal">
        <div class="login-box">
            <button class="close-btn" onclick="closeLoginModal()">&times;</button>
            <h2>Log in</h2>
            <p>Sign in to your account</p>

            <!-- ฟอร์มส่งข้อมูลไปยัง app.py ของคุณ -->
            <form action="/" method="POST">
                <div class="input-group">
                    <label for="username">Email address*</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="password">Password*</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="submit-btn">Continue</button>
            </form>
        </div>
    </div>

    <!-- JavaScript สำหรับควบคุมการเปิด-ปิดหน้าต่าง -->
    <script>
        const modal = document.getElementById('loginModal');

        function openLoginModal() {
            modal.style.display = 'flex'; // แสดงหน้าต่าง
        }

        function closeLoginModal() {
            modal.style.display = 'none'; // ซ่อนหน้าต่าง
        }

        // ปิดหน้าต่างเมื่อคลิกพื้นที่ว่างรอบๆ กล่อง
        window.onclick = function(event) {
            if (event.target == modal) {
                closeLoginModal();
            }
        }
    </script>

</body>
</html>
