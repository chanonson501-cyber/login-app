<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - VCC Engineering</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='reference_project.css') }}">
</head>
<body>

    <!-- แถบเมนูด้านบน -->
    <header>
        <div class="logo">VCC Engineering Co.,Ltd</div>
        <div style="display: flex; align-items: center; gap: 30px;">
            <div class="nav-links">
                <a href="{{ url_for('home') }}" class="nav-item">Home</a>
                <a href="#" class="nav-item">About us</a>
                <a href="#" class="nav-item">Contact</a>
            </div>
        </div>
    </header>

    <!-- ส่วนสไลด์โชว์หลัก (Hero Slider - ทั้งหมด 5 สไลด์) -->
   <div class="hero-product-section">
    <div class="hero-container">
        
        <!-- ฝั่งซ้าย: จุดบอกสถานะสไลด์ (Pagination Dots) -->
        <div class="hero-dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

        <!-- ตรงกลาง: หัวข้อและรายละเอียดโปรเจกต์ -->
        <div class="hero-content">
            <h1 class="main-heading">Products</h1>
            <div class="product-info-box">
                <h2>Excavator Substation</h2>
                <p>Efficient power system and control upgrade</p>
                <a href="#details" class="discover-btn">DISCOVER MORE</a>
            </div>
        </div>

        <!-- ฝั่งขวา: รูปภาพสินค้า/โปรเจกต์เด่น -->
        <div class="hero-image">
            <img src="{{ url_for('static', filename='cabinet.jpg') }}" alt="Product Image">
        </div>

    </div>
</div>

<!-- Script สำหรับคลิกเปลี่ยนรูปภาพย่อย -->
<script>
    // ข้อมูลโปรเจกต์ทั้งหมด (สามารถเพิ่มหรือแก้ไขข้อมูลตรงนี้ได้เลยครับ)
    const heroProjects = [
        {
            title: "Excavator Substation",
            desc: "Efficient power system and control upgrade",
            image: "{{ url_for('static', filename='cabinet.jpg') }}",
            bg: "{{ url_for('static', filename='station.jpg') }}"
        },
        {
            title: "Project Two Name",
            desc: "Description or detail of project two...",
            image: "{{ url_for('static', filename='station.jpg') }}",
            bg: "{{ url_for('static', filename='cabinet.jpg') }}"
        },
        {
            title: "Project Three Name",
            desc: "Description or detail of project three...",
            image: "{{ url_for('static', filename='cable.jpg') }}",
            bg: "{{ url_for('static', filename='Electric.jpg') }}"
        },
        {
            title: "Project Four Name",
            desc: "Description or detail of project four...",
            image: "{{ url_for('static', filename='Electric.jpg') }}",
            bg: "{{ url_for('static', filename='cable.jpg') }}"
        }
    ];

    const dots = document.querySelectorAll('.hero-dots .dot');
    const heroTitle = document.querySelector('.product-info-box h2');
    const heroDesc = document.querySelector('.product-info-box p');
    const heroImg = document.querySelector('.hero-image img');
    const heroSection = document.querySelector('.hero-product-section');

    let currentIndex = 0;
    const totalSlides = heroProjects.length;
    let isScrolling = false; // ตัวแปรป้องกันการเลื่อนรัวเกินไป

    // ฟังก์ชันอัปเดตการแสดงผลของสไลด์
    function updateSlide(index) {
        // อัปเดตจุด Active
        dots.forEach(d => d.classList.remove('active'));
        if (dots[index]) {
            dots[index].classList.add('active');
        }

        // อัปเดตข้อมูลและรูปภาพ
        const proj = heroProjects[index];
        if (proj) {
            heroTitle.textContent = proj.title;
            heroDesc.textContent = proj.desc;
            heroImg.src = proj.image;
            heroSection.style.backgroundImage = `url("${proj.bg}")`;
        }
    }

    // 1. ควบคุมการคลิกที่จุด (Dots)
    dots.forEach((dot, index) => {
        dot.addEventListener('click', () => {
            currentIndex = index;
            updateSlide(currentIndex);
        });
    });

    // 2. ควบคุมการเลื่อนด้วยลูกกลิ้งเมาส์ (Mouse Wheel)
    heroSection.addEventListener('wheel', (e) => {
        e.preventDefault(); // ป้องกันไม่ให้หน้าเว็บหลักเลื่อนทันทีขณะอยู่บนแบนเนอร์

        if (isScrolling) return;
        isScrolling = true;

        if (e.deltaY > 0) {
            // หมุนลูกกลิ้งลง -> ไปสไลด์ถัดไป
            currentIndex = (currentIndex + 1) % totalSlides;
        } else {
            // หมุนลูกกลิ้งขึ้น -> กลับไปสไลด์ก่อนหน้า
            currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
        }

        updateSlide(currentIndex);

        // กำหนดหน่วงเวลา (Delay) 800 มิลลิวินาที เพื่อความนุ่มนวลและป้องกันสไลด์กระโดดข้ามรัวๆ
        setTimeout(() => {
            isScrolling = false;
        }, 800);

    }, { passive: false });
</script>
</body>
</html>
