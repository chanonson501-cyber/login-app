<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - VCC Engineering</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='reference_project.css') }}">
</head>
<body>

    <!-- แถบเมนูด้านบน -->
    <header>
        <div class="logo">VCC Engineering Co.,Ltd</div>
        <div style="display: flex; align-items: center; gap: 30px;">
            <div class="nav-links">
                <a href="{{ url_for('home') }}" class="nav-item">Home</a>
                <a href="#" class="nav-item">About us</a>
                <a href="#" class="nav-item">Contact</a>
            </div>
        </div>
    </header>

    <!-- ส่วนสไลด์โชว์หลัก (Hero Slider - ทั้งหมด 5 สไลด์) -->
   <div class="hero-product-section">
    <div class="hero-container">
        
        <!-- ฝั่งซ้าย: จุดบอกสถานะสไลด์ (Pagination Dots) -->
        <div class="hero-dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

        <!-- ตรงกลาง: หัวข้อและรายละเอียดโปรเจกต์ -->
        <div class="hero-content">
            <h1 class="main-heading">Major Project</h1>
            <div class="product-info-box">
                <h2>Excavator Power Supply Substation</h2>
                <h3 id="hero-value">Project Value</h3>
                <p>Efficient power system and control upgrade</p>
            </div>
        </div>

        <!-- ฝั่งขวา: รูปภาพหลักและรูปย่อย 4 รูป -->
        <div class="hero-image">
            <div class="main-image-box">
                <button class="slider-btn prev-btn">&#10094;</button>
                <img src="" alt="Main Product Image" id="current-main-img">
                <button class="slider-btn next-btn">&#10095;</button>
            </div>
            <div class="thumbnail-list">
                <img src="" class="thumb active" alt="Thumb 1" data-index="0">
                <img src="" class="thumb" alt="Thumb 2" data-index="1">
                <img src="" class="thumb" alt="Thumb 3" data-index="2">
                <img src="" class="thumb" alt="Thumb 4" data-index="3">
            </div>
        </div>

    </div>
</div>

<!-- Script สำหรับคลิกเปลี่ยนรูปภาพย่อย -->
<script>
    const heroProjects = [
        {
            title: "E-House and Electric Component (WL2 Expansion - BLT)",
            Value: "Project Value 175.5 Million THB",
            desc: "V.C.C. Engineering Co., Ltd. has been entrusted by Sahakol Equipment to provide comprehensive engineering and full-service solutions for the conveyor belt control system. This includes control panel assembly, installation, and programming of the control system for the following E-Houses and conveyor units (Waste Line 2)",
            bg: "{{ url_for('static', filename='5.jpg') }}",
            images: [
                "{{ url_for('static', filename='2.jpg') }}",
                "{{ url_for('static', filename='3.jpg') }}",
                "{{ url_for('static', filename='4.jpg') }}",
                "{{ url_for('static', filename='1.jpg') }}"
            ]
        },
        {
            title: "Project Two Name",
            Value: "8.5 Million THB",
            desc: "Description or detail of project two...",
            bg: "{{ url_for('static', filename='cabinet.jpg') }}",
            images: [
                "{{ url_for('static', filename='station.jpg') }}",
                "{{ url_for('static', filename='cabinet.jpg') }}",
                "{{ url_for('static', filename='Electric.jpg') }}",
                "{{ url_for('static', filename='cable.jpg') }}"
            ]
        },
        {
            title: "Project Three Name",
            Value: "20 Million THB",
            desc: "Description or detail of project three...",
            bg: "{{ url_for('static', filename='cable.jpg') }}",
            images: [
                "{{ url_for('static', filename='cable.jpg') }}",
                "{{ url_for('static', filename='Electric.jpg') }}",
                "{{ url_for('static', filename='station.jpg') }}",
                "{{ url_for('static', filename='cabinet.jpg') }}"
            ]
        },
        {
            title: "Project Four Name",
            Value: "5 Million THB",
            desc: "Description or detail of project four...",
            bg: "{{ url_for('static', filename='Electric.jpg') }}",
            images: [
                "{{ url_for('static', filename='Electric.jpg') }}",
                "{{ url_for('static', filename='cable.jpg') }}",
                "{{ url_for('static', filename='cabinet.jpg') }}",
                "{{ url_for('static', filename='station.jpg') }}"
            ]
        }
    ];

    const dots = document.querySelectorAll('.hero-dots .dot');
    const heroTitle = document.querySelector('.product-info-box h2');
    const heroValue = document.getElementById('hero-value');
    const heroDesc = document.querySelector('.product-info-box p');
    const heroSection = document.querySelector('.hero-product-section');
    
    const mainImg = document.getElementById('current-main-img');
    const thumbs = document.querySelectorAll('.thumbnail-list .thumb');
    const prevBtn = document.querySelector('.prev-btn');
    const nextBtn = document.querySelector('.next-btn');

    let currentProjectIndex = 0;
    let currentImageIndex = 0;
    let isScrolling = false;

    // ฟังก์ชันอัปเดตหน้าจอทั้งหมดตามโปรเจกต์และรูปภาพย่อยปัจจุบัน
    fnLoadSlide = (pIndex, imgIndex = 0) => {
        const proj = heroProjects[pIndex];
        if (!proj) return;

        currentProjectIndex = pIndex;
        currentImageIndex = imgIndex;

        // อัปเดตข้อความและพื้นหลัง
        heroTitle.textContent = proj.title;
        heroValue.textContent = proj.Value;
        heroDesc.textContent = proj.desc;
        heroSection.style.backgroundImage = `url("${proj.bg}")`;

        // อัปเดตจุด Dots ฝั่งซ้าย
        dots.forEach((d, idx) => {
            d.classList.toggle('active', idx === pIndex);
        });

        // อัปเดตรูปภาพย่อย 4 รูป และรูปหลัก
        proj.images.forEach((imgSrc, idx) => {
            if (thumbs[idx]) {
                thumbs[idx].src = imgSrc;
                thumbs[idx].classList.toggle('active', idx === imgIndex);
            }
        });
        mainImg.src = proj.images[imgIndex];
    };

    // 1. คลิกเปลี่ยนรูปย่อย (Thumbnail)
    thumbs.forEach((thumb, idx) => {
        thumb.addEventListener('click', () => {
            currentImageIndex = idx;
            mainImg.src = heroProjects[currentProjectIndex].images[currentImageIndex];
            thumbs.forEach(t => t.classList.remove('active'));
            thumb.classList.add('active');
        });
    });

    // 2. ปุ่มลูกศรซ้าย-ขวา สำหรับเปลี่ยนรูปย่อยภายในโปรเจกต์
    prevBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const images = heroProjects[currentProjectIndex].images;
        currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
        fnLoadSlide(currentProjectIndex, currentImageIndex);
    });

    nextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const images = heroProjects[currentProjectIndex].images;
        currentImageIndex = (currentImageIndex + 1) % images.length;
        fnLoadSlide(currentProjectIndex, currentImageIndex);
    });

    // 3. คลิกที่จุด Dots เพื่อเปลี่ยนโปรเจกต์หลัก
    dots.forEach((dot, index) => {
        dot.addEventListener('click', () => {
            fnLoadSlide(index, 0);
        });
    });

    // 4. เลื่อนลูกกลิ้งเมาส์เปลี่ยนโปรเจกต์
    heroSection.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (isScrolling) return;
        isScrolling = true;

        if (e.deltaY > 0) {
            currentProjectIndex = (currentProjectIndex + 1) % heroProjects.length;
        } else {
            currentProjectIndex = (currentProjectIndex - 1 + heroProjects.length) % heroProjects.length;
        }

        fnLoadSlide(currentProjectIndex, 0);

        setTimeout(() => {
            isScrolling = false;
        }, 350);
    }, { passive: false });

    // โหลดค่าเริ่มต้นครั้งแรก
    fnLoadSlide(0, 0);
</script>
</body>
</html>
